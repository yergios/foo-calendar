# Every check that decides whether master is shippable. A red run means one of them failed;
# none of them is advisory. Run the same commands locally before pushing (see each step).

name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every job has a timeout of a few times its usual run, so a hang (a test waiting on
  # something that never comes, a browser that stops answering) fails in minutes rather
  # than holding a runner for GitHub's six-hour default.
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The SDK global.json pins, rather than a version written here: the build, the
      # analyzers and the developer's machine then agree on one feature band.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Also the dependency audit: NuGet checks every package, transitive ones included,
      # against the advisory database during restore, and Directory.Build.props turns
      # those findings into errors.
      - name: Restore
        run: dotnet restore

      # Every analyzer rule is on and warnings fail the build, so this is also the lint.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      # The version is written in two places that nothing else ties together.
      - name: API and SPA versions agree
        run: |
          api=$(grep -oP '<Version>\K[^<]+' src/Api/Api.csproj)
          web=$(jq -r .version src/Web/package.json)
          if [ "$api" != "$web" ]; then
            echo "::error::Api.csproj is $api but package.json is $web"
            exit 1
          fi

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/Web
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json's packageManager field.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/Web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/Web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint:check

      - name: Format
        run: pnpm format:check

      - name: Test
        run: pnpm test

      # High and critical only, dev tooling included. Moderate findings in lint tooling
      # often have no fix inside the ranges upstream allows yet, and failing on them would
      # train everyone to ignore a red run.
      - name: Audit dependencies
        run: pnpm audit --audit-level high

  trace:
    name: Spec traceability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The whole history: the privacy review check below reads every commit of the push or
      # the pull request, and where the review started.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same Node as the web job. The script has no dependencies, so there is no install.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Every [test] requirement in SPEC.md is referenced by a test or on the gap list,
      # and every ID a test references exists (TRC-1, TRC-2).
      - name: Check
        run: node scripts/check-spec-trace.mjs

      # The scripts' own tests: the trace check's, so a change to how it reads tests can't
      # quietly start counting a skipped or commented-out one, and the privacy review's
      # diff hash and touch detection (AGT-4).
      - name: Test the scripts
        run: node --test --test-timeout=60000 'scripts/**/*.test.mjs'

      # Every commit of the push or the pull request that touches absence notes carries the
      # Privacy-Review trailer of its own diff (AGT-5). For a pull request, its own commits,
      # never the merge commit GitHub makes to test it. A push that creates the branch
      # reports an all-zeros "before", and the script then checks the pushed commit alone.
      - name: Privacy review trailers
        env:
          FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/privacy-review.mjs verify "$FROM" "$TO"

  image:
    name: Container image and browser checks
    runs-on: ubuntu-latest
    # An uncached image build is most of this; the browser checks take under a minute.
    timeout-minutes: 25
    env:
      # One Chrome for Testing release, and the SHA-256 of its linux64 zip, checked before
      # the browser is unpacked. To move to another release, change both together: take the
      # version from https://googlechromelabs.github.io/chrome-for-testing/, download
      #   https://storage.googleapis.com/chrome-for-testing-public/<version>/linux64/chrome-headless-shell-linux64.zip
      # and put the output of `sha256sum` on it here. The cache key carries both, so the new
      # zip is downloaded and checked rather than an old cache restored.
      CHROME_HEADLESS_SHELL_VERSION: 152.0.7977.75
      CHROME_HEADLESS_SHELL_SHA256: 66ffefd34dc6af6c7d8e6933546c40ed5278fa3d495c3e836895241ba3a3a19f
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The Dockerfile builds the SPA and publishes the API itself, so this is also the
      # production build of both.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: foo-calendar:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the image starts, applies migrations to an empty database, and serves both
      # the health endpoint and the SPA shell. Development is the only environment that
      # starts without an identity provider; Holidays:Source=None keeps the run offline.
      - name: Smoke test
        id: smoke
        run: |
          docker run --detach --name app --publish 8080:8080 \
            --env ASPNETCORE_ENVIRONMENT=Development \
            --env Holidays__Source=None \
            foo-calendar:ci

          for _ in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/healthchecks; then break; fi
            sleep 1
          done

          curl --fail --silent --show-error http://localhost:8080/healthchecks | grep -q '"Healthy"'
          curl --fail --silent --show-error http://localhost:8080/ | grep -q '<base href='

      # A second instance whose dev identity holds no permission, for the flows that check
      # what such a member is offered (UI-10).
      - name: Start an instance without permissions
        run: |
          docker run --detach --name app-no-permissions --publish 8081:8080 \
            --env ASPNETCORE_ENVIRONMENT=Development \
            --env Holidays__Source=None \
            --env Auth__DevUser__GrantAllPermissions=false \
            foo-calendar:ci

          for _ in $(seq 1 30); do
            if curl --fail --silent http://localhost:8081/healthchecks; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://localhost:8081/healthchecks | grep -q '"Healthy"'

      # Three instances that sign in through the stub OIDC provider the end-to-end suite
      # starts on ports 9000 and 9001 (tools/e2e/oidc-stub.mjs): its own-origin tenant, and
      # its tenant whose token endpoint is on the second origin, without and with that
      # origin in Auth:ExtraOrigins. On the host's network, so the API and the browser reach
      # the provider at the same localhost URL, which is also its issuer. Development only
      # for the stub's http origin, which CFG-2 accepts nowhere else: Auth:Provider=Oidc
      # turns the dev identity off, and tokens are validated as in production.
      - name: Start instances that sign in through a provider
        run: |
          oidc=(--env ASPNETCORE_ENVIRONMENT=Development --env Holidays__Source=None
            --env Auth__Provider=Oidc --env Auth__Audience=foo-calendar-e2e
            --env Auth__ClientId=foo-calendar-e2e-spa)
          docker run --detach --name app-oidc --network host --env ASPNETCORE_HTTP_PORTS=8082 \
            "${oidc[@]}" --env Auth__Authority=http://localhost:9000 foo-calendar:ci
          docker run --detach --name app-oidc-split --network host --env ASPNETCORE_HTTP_PORTS=8083 \
            "${oidc[@]}" --env Auth__Authority=http://localhost:9000/split foo-calendar:ci
          docker run --detach --name app-oidc-split-extra --network host --env ASPNETCORE_HTTP_PORTS=8084 \
            "${oidc[@]}" --env Auth__Authority=http://localhost:9000/split \
            --env Auth__ExtraOrigins__0=http://localhost:9001 foo-calendar:ci

          for port in 8082 8083 8084; do
            for _ in $(seq 1 30); do
              if curl --fail --silent "http://localhost:$port/healthchecks"; then break; fi
              sleep 1
            done
            curl --fail --silent --show-error "http://localhost:$port/healthchecks" | grep -q '"Healthy"'
          done

      # The browser checks (docs/decisions/0016) run on tools/browser, which needs nothing
      # but Node and a chrome-headless-shell. Ubuntu 24.04 keeps unprivileged processes
      # from creating the user namespaces Chromium's sandbox is built on; allowing them
      # keeps the browser sandboxed rather than running it with --no-sandbox.
      - name: Allow the browser sandbox
        run: sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Pinned to one Chrome for Testing release, so a new browser never changes a result
      # by itself; bump the version deliberately.
      - name: Cache chrome-headless-shell
        id: chrome
        uses: actions/cache@v6
        with:
          path: ~/.cache/chrome-headless-shell
          key: chrome-headless-shell-${{ env.CHROME_HEADLESS_SHELL_VERSION }}-${{ env.CHROME_HEADLESS_SHELL_SHA256 }}

      - name: Download chrome-headless-shell
        if: steps.chrome.outputs.cache-hit != 'true'
        run: |
          mkdir --parents ~/.cache/chrome-headless-shell
          curl --fail --silent --show-error --location --output /tmp/chrome-headless-shell.zip \
            "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_HEADLESS_SHELL_VERSION}/linux64/chrome-headless-shell-linux64.zip"
          # Nothing is unpacked, let alone run, unless it is the zip pinned above.
          echo "${CHROME_HEADLESS_SHELL_SHA256}  /tmp/chrome-headless-shell.zip" | sha256sum --check --strict || {
            echo "::error title=chrome-headless-shell::the download does not match CHROME_HEADLESS_SHELL_SHA256"
            exit 1
          }
          unzip -q /tmp/chrome-headless-shell.zip -d ~/.cache/chrome-headless-shell

      # The main flows in a real browser, signing in through a stub provider among them,
      # failing on any Content-Security-Policy violation a flow does not expect
      # (SEC-1, SEC-3, SEC-4, UI-4, UI-10, AUTH-1, AUTH-8, UI-9).
      - name: End-to-end tests
        env:
          APP_URL: http://localhost:8080/
          APP_URL_NO_PERMISSIONS: http://localhost:8081/
          APP_URL_OIDC: http://localhost:8082/
          APP_URL_OIDC_SPLIT: http://localhost:8083/
          APP_URL_OIDC_SPLIT_EXTRA_ORIGIN: http://localhost:8084/
          E2E_OUT: ${{ runner.temp }}/e2e
        # The failing tests and their errors become annotations on the run, so what broke
        # reads on its summary page without opening the log.
        run: |
          mkdir --parents "$E2E_OUT"
          set -o pipefail
          # A flow that hangs fails on its own after two minutes, rather than the job's.
          node --test --test-timeout=120000 --test-reporter=spec tools/e2e/flows.test.mjs 2>&1 | tee "$E2E_OUT/output.txt" || {
            grep -E '^\s*(✖|\w*Error)' "$E2E_OUT/output.txt" | head -n 20 |
              while IFS= read -r line; do echo "::error title=End-to-end::$line"; done
            exit 1
          }

      # A screenshot, the console and the violations of each flow that failed.
      - name: Upload end-to-end failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore

      # The calendar at 1000 synthetic people: under 5,000 DOM nodes after every
      # interaction (PERF-1), and each interaction's longest main-thread block within the
      # larger of three times tools/perf/baseline.json and 16 ms (PERF-2). Runs whether or not the flows above
      # passed, as long as the container is up: the two answer different questions. A
      # timing breach is measured once more and fails only when it breaches again; the DOM
      # budget never is noise. Every interaction's longest block, per attempt, goes to the
      # job summary.
      - name: Performance budget
        id: perf
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        env:
          APP_URL: http://localhost:8080/
          RESULT_OUT: ${{ runner.temp }}/perf/results.json
          TRACE_OUT: ${{ runner.temp }}/perf/trace.json
        run: |
          mkdir --parents "$RUNNER_TEMP/perf"
          set -o pipefail
          # A budget breach annotates itself; anything that stops the run is annotated here.
          node tools/perf/harness.mjs 1000 --budget 2>&1 | tee "$RUNNER_TEMP/perf/output.txt" || {
            grep -E '^\s*\w*Error' "$RUNNER_TEMP/perf/output.txt" | head -n 10 |
              while IFS= read -r line; do echo "::error title=Performance budget::$line"; done
            exit 1
          }

      # Either way, so a passing run's numbers are there to compare with. The trace, which
      # loads in DevTools' Performance panel, only when the budget failed: it is large.
      - name: Upload performance results
        if: ${{ !cancelled() && steps.perf.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: ${{ runner.temp }}/perf/results.json
          if-no-files-found: ignore

      - name: Upload performance trace
        if: ${{ !cancelled() && steps.perf.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: perf-trace
          path: ${{ runner.temp }}/perf/trace.json
          if-no-files-found: ignore

      - name: Container logs
        if: failure()
        run: |
          docker logs app
          for name in app-no-permissions app-oidc app-oidc-split app-oidc-split-extra; do
            echo "---- $name"
            docker logs "$name" || true
          done
