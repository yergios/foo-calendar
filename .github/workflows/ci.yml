# Every check that decides whether master is shippable. A red run means one of them failed;
# none of them is advisory. Run the same commands locally before pushing (see each step).

name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The SDK global.json pins, rather than a version written here: the build, the
      # analyzers and the developer's machine then agree on one feature band.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Also the dependency audit: NuGet checks every package, transitive ones included,
      # against the advisory database during restore, and Directory.Build.props turns
      # those findings into errors.
      - name: Restore
        run: dotnet restore

      # Every analyzer rule is on and warnings fail the build, so this is also the lint.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      # The version is written in two places that nothing else ties together.
      - name: API and SPA versions agree
        run: |
          api=$(grep -oP '<Version>\K[^<]+' src/Api/Api.csproj)
          web=$(jq -r .version src/Web/package.json)
          if [ "$api" != "$web" ]; then
            echo "::error::Api.csproj is $api but package.json is $web"
            exit 1
          fi

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Web
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json's packageManager field.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/Web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/Web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint:check

      - name: Format
        run: pnpm format:check

      - name: Test
        run: pnpm test

      # High and critical only, dev tooling included. Moderate findings in lint tooling
      # often have no fix inside the ranges upstream allows yet, and failing on them would
      # train everyone to ignore a red run.
      - name: Audit dependencies
        run: pnpm audit --audit-level high

  trace:
    name: Spec traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same Node as the web job. The script has no dependencies, so there is no install.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Every [test] requirement in SPEC.md is referenced by a test or on the gap list,
      # and every ID a test references exists (TRC-1, TRC-2).
      - name: Check
        run: node scripts/check-spec-trace.mjs

      # The check's own tests, so a change to how it reads tests can't quietly start
      # counting a skipped or commented-out one.
      - name: Test the check
        run: node --test scripts/check-spec-trace.test.mjs

  image:
    name: Container image and browser checks
    runs-on: ubuntu-latest
    env:
      CHROME_HEADLESS_SHELL_VERSION: 152.0.7977.75
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The Dockerfile builds the SPA and publishes the API itself, so this is also the
      # production build of both.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: foo-calendar:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the image starts, applies migrations to an empty database, and serves both
      # the health endpoint and the SPA shell. Development is the only environment that
      # starts without an identity provider; Holidays:Source=None keeps the run offline.
      - name: Smoke test
        run: |
          docker run --detach --name app --publish 8080:8080 \
            --env ASPNETCORE_ENVIRONMENT=Development \
            --env Holidays__Source=None \
            foo-calendar:ci

          for _ in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/healthchecks; then break; fi
            sleep 1
          done

          curl --fail --silent --show-error http://localhost:8080/healthchecks | grep -q '"Healthy"'
          curl --fail --silent --show-error http://localhost:8080/ | grep -q '<base href='

      # A second instance whose dev identity holds no permission, for the flows that check
      # what such a member is offered (UI-10).
      - name: Start an instance without permissions
        run: |
          docker run --detach --name app-no-permissions --publish 8081:8080 \
            --env ASPNETCORE_ENVIRONMENT=Development \
            --env Holidays__Source=None \
            --env Auth__DevUser__GrantAllPermissions=false \
            foo-calendar:ci

          for _ in $(seq 1 30); do
            if curl --fail --silent http://localhost:8081/healthchecks; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://localhost:8081/healthchecks | grep -q '"Healthy"'

      # The browser checks (docs/decisions/0016) run on tools/browser, which needs nothing
      # but Node and a chrome-headless-shell.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Pinned to one Chrome for Testing release, so a new browser never changes a result
      # by itself; bump the version deliberately.
      - name: Cache chrome-headless-shell
        id: chrome
        uses: actions/cache@v6
        with:
          path: ~/.cache/chrome-headless-shell
          key: chrome-headless-shell-${{ env.CHROME_HEADLESS_SHELL_VERSION }}

      - name: Download chrome-headless-shell
        if: steps.chrome.outputs.cache-hit != 'true'
        run: |
          mkdir --parents ~/.cache/chrome-headless-shell
          curl --fail --silent --show-error --location --output /tmp/chrome-headless-shell.zip \
            "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_HEADLESS_SHELL_VERSION}/linux64/chrome-headless-shell-linux64.zip"
          unzip -q /tmp/chrome-headless-shell.zip -d ~/.cache/chrome-headless-shell

      # The main flows in a real browser, failing on any Content-Security-Policy violation
      # (SEC-3, SEC-4, UI-4, UI-10, AUTH-8, UI-9).
      - name: End-to-end tests
        env:
          APP_URL: http://localhost:8080/
          APP_URL_NO_PERMISSIONS: http://localhost:8081/
          E2E_OUT: ${{ runner.temp }}/e2e
        run: node --test tools/e2e/flows.test.mjs

      # A screenshot, the console and the violations of each flow that failed.
      - name: Upload end-to-end failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore

      - name: Container logs
        if: failure()
        run: |
          docker logs app
          docker logs app-no-permissions || true
